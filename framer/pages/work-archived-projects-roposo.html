  try{

    if(os===pref)return;
    var tk=JSON.parse(raw);
    var cloak=document.createElement("style");
    cloak.id="themeshift-cloak";
    cloak.textContent="html{opacity:0!important}";
    document.head.appendChild(cloak);
    function done(){
      var css="";

    else{

        var s=document.querySelectorAll("style");

      });

      setTimeout(function(){obs.disconnect();done();},4000);
    }
  }catch(e){}
})();
