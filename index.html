<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Portfolio of product designer Gaurav Borra.">
    <link rel="icon" type="image/png" href="/Assets/png/favicon.png">
    <title>Gaurav Borra Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/CSS/main.css?v=mobile-frame-1">
    <script src="/JS/codex-preloader.js?v=mobile-frame-1" defer></script>
  </head>

  <body class="portfolio-page">
    <div
      id="codex-preloader"
      data-component="/Components/codex-preloader.html?v=mobile-frame-1"
      role="status"
      aria-live="polite"
      aria-label="Loading portfolio"
    ></div>

    <iframe
      class="portfolio-frame"
      src="https://gauravborra.framer.website"
      title="Gaurav Borra portfolio"
      allowfullscreen
      frameborder="0"
      marginheight="0"
      marginwidth="0"
      scrolling="auto"
    ></iframe>

    <a
      class="resume-strip"
      href="/Assets/Gaurav_Borra_Product_Design_Manager_Resume.pdf"
      target="_blank"
      rel="noopener"
      aria-label="Check out my resume"
    ></a>

  </body>
</html>
