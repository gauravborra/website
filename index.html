<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Portfolio of product designer Gaurav Borra.">
    <link rel="icon" type="image/png" href="/Assets/png/favicon.png">
    <title>Gaurav Borra Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/CSS/main.css">
  </head>

  <body class="no-scroll">
    <div id="preload" aria-live="polite" aria-label="Loading portfolio">
      <div id="introtext">
        <h3>Hi, I am</h3>
        <h1>Gaurav Borra</h1>
        <p>I make memorable <br>Experiences</p>
      </div>
      <div class="loader" aria-hidden="true"></div>
    </div>

    <iframe
      class="portfolio-frame"
      src="https://gauravborra.framer.website"
      title="Gaurav Borra portfolio"
      allowfullscreen
      frameborder="0"
      marginheight="0"
      marginwidth="0"
      scrolling="auto"
    ></iframe>

    <a
      class="resume-strip"
      href="/Assets/Gaurav_Borra_Product_Design_Manager_Resume.pdf"
      target="_blank"
      rel="noopener"
      aria-label="Check out my resume"
    ></a>

  <script>
  const body = document.body;
  const preload = document.getElementById('preload');
  const frame = document.querySelector('.portfolio-frame');

  const minimumPreloaderTime = 3000; // 3 seconds
  const startedAt = Date.now();

  function hidePreloader() {
    const elapsed = Date.now() - startedAt;
    const remaining = Math.max(0, minimumPreloaderTime - elapsed);

    setTimeout(() => {
      preload.classList.add('preload-end');
      body.classList.remove('no-scroll');
    }, remaining);
  }

  frame.addEventListener('load', hidePreloader);
</script>

  </body>
</html>
