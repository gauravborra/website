<script>
  const preload = document.getElementById("preload");

  // Show preloader instantly (already visible)
  
  // Start transition after slight delay (not waiting for load)
  setTimeout(() => {
    preload.classList.add("preload-end"); // fade out (you already have CSS)
  }, 800);

  // Redirect AFTER animation completes
  setTimeout(() => {
    window.location.href = "/framer/";
  }, 1400);
</script>
